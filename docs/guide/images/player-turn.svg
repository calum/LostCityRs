<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 606" width="600" height="606" role="img">
<title>The eleven steps of one player's turn in phase 5</title>
<rect x="0" y="0" width="600" height="606" fill="#ffffff"/>
<text x="300" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">One player's turn (phase 5)</text>
<rect x="30" y="46" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="72" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">1</text>
<text x="84" y="72" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Undelay</text>
<text x="560" y="72" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">delayed ends when currentTick &gt;= delayedUntil</text>
<line x1="300" y1="84" x2="300" y2="96" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="96" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="122" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">2</text>
<text x="84" y="122" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Resume a suspended script</text>
<text x="560" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">only if not delayed</text>
<line x1="300" y1="134" x2="300" y2="146" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="146" width="540" height="38" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="172" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">3</text>
<text x="84" y="172" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Queues</text>
<text x="560" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">close modal if asked, normal queue, weak queue</text>
<line x1="300" y1="184" x2="300" y2="196" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="196" width="540" height="38" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="222" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">4</text>
<text x="84" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Timers</text>
<text x="560" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">normal, then soft (not while logging out)</text>
<line x1="300" y1="234" x2="300" y2="246" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="246" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="272" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">5</text>
<text x="84" y="272" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Engine queue</text>
<text x="560" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">stat changes, zone and map triggers</text>
<line x1="300" y1="284" x2="300" y2="296" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="296" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="322" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">6</text>
<text x="84" y="322" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Face the target</text>
<text x="560" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">setFaceEntity</text>
<line x1="300" y1="334" x2="300" y2="346" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="346" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="372" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">7</text>
<text x="84" y="372" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Re-aim</text>
<text x="560" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">reorientEntity</text>
<line x1="300" y1="384" x2="300" y2="396" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="396" width="540" height="38" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="422" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">8</text>
<text x="84" y="422" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Interaction and movement</text>
<text x="560" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">try op/ap, move 1 or 2 tiles, try again</text>
<line x1="300" y1="434" x2="300" y2="446" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="446" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="472" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">9</text>
<text x="84" y="472" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Reorient</text>
<text x="560" y="472" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">face a loc/obj if standing still</text>
<line x1="300" y1="484" x2="300" y2="496" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="496" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="522" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">10</text>
<text x="84" y="522" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Run energy</text>
<text x="560" y="522" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">skipped while delayed</text>
<line x1="300" y1="534" x2="300" y2="546" stroke="#111111" stroke-width="2.5"/>
<rect x="30" y="546" width="540" height="38" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="48" y="572" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">11</text>
<text x="84" y="572" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">Distance check</text>
<text x="560" y="572" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#666666">sets the jump flag; skipped for exact move</text>
</svg>
