<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 396" width="790" height="396" role="img">
<title>A queue entry runs for the player, then world_delay hands the same script state to the world queue, which runs the remaining pulses</title>
<rect x="0" y="0" width="790" height="396" fill="#ffffff"/>
<text x="395.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">Green mist: a script that stops belonging to the player</text>
<rect x="16" y="56" width="758" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<rect x="16" y="168" width="758" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="76" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">Player</text>
<text x="76" y="115" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">(phase 5)</text>
<text x="76" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">World queue</text>
<text x="76" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">(phase 1)</text>
<rect x="130" y="76" width="96" height="54" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.5"/>
<text x="178" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">T+1:</text>
<text x="178" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">queue(..., 16, 0)</text>
<line x1="226" y1="103" x2="262" y2="103" stroke="#111111" stroke-width="2.5"/>
<polygon points="260,96 260,110 270,103" fill="#111111"/>
<rect x="270" y="76" width="150" height="54" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="345" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">dragged tile by tile:</text>
<text x="345" y="111" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">delayed, counter still</text>
<text x="345" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">counts down</text>
<line x1="420" y1="103" x2="456" y2="103" stroke="#111111" stroke-width="2.5"/>
<polygon points="454,96 454,110 464,103" fill="#111111"/>
<rect x="464" y="76" width="150" height="54" rx="6" fill="#111111" stroke="#111111" stroke-width="2.5"/>
<text x="539" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">Q: queue entry runs,</text>
<text x="539" y="109" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">pulse 0, then</text>
<text x="539" y="122" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">world_delay(3)</text>
<line x1="539" y1="130" x2="539" y2="181" stroke="#111111" stroke-width="2.5"/>
<polygon points="532,179 546,179 539,188" fill="#111111"/>
<rect x="464" y="188" width="150" height="58" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.5"/>
<text x="539" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">same ScriptState in</text>
<text x="539" y="223" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">the world queue</text>
<text x="539" y="236" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">(no player attached)</text>
<line x1="614" y1="217" x2="628" y2="217" stroke="#111111" stroke-width="2.5"/>
<polygon points="626,210 626,224 636,217" fill="#111111"/>
<rect x="640" y="198" width="38" height="38" rx="6" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="659" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">Q+5</text>
<rect x="682" y="198" width="38" height="38" rx="6" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="701" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">Q+10</text>
<rect x="724" y="198" width="38" height="38" rx="6" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="743" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">Q+15</text>
<text x="701" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">pulses 1-3, if alone in queue</text>
<rect x="16" y="280" width="758" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="28" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">Before Q: a plain queue entry means a logout request waits until it has run (World.ts:764-779).</text>
<text x="28" y="323" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">After Q: nothing the player does can stop the pulses; they hit whoever stands within 1 tile of the saved coordinate.</text>
<text x="28" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">The saved coordinate is where the player stood at Q, not at the gate.</text>
<text x="28" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">No varp holds any of this, so a server restart loses it.</text>
</svg>
