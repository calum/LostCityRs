<text x="30" y="177" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">start tile</text>
<line x1="90.0" y1="148" x2="90.0" y2="117" stroke="#111111" stroke-width="2"/>
