<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img">
<title>The Mime director cycle of 16 counts and a player's state machine from 7 through 100, 101 and 102 to the reward</title>
<rect x="0" y="0" width="700" height="372" fill="#ffffff"/>
<text x="350" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">The Mime: one director, many players</text>
<text x="20" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#555555">The NPC's ai_timer fires every 2 ticks. count = (map_clock mod 32) / 2, so each value 0 to 15 comes round once per 32 ticks.</text>
