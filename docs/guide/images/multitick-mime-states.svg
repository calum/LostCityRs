<line x1="80.0" y1="314" x2="328.0" y2="314" stroke="#111111" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="80.0" y1="314" x2="80.0" y2="279" stroke="#111111" stroke-width="2"/>
