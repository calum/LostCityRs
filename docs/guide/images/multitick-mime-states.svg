<text x="182.0" y="177" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">interface</text>
<text x="310" y="148" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#555555">(counts 2, 3 and 5 to 15 do nothing here)</text>
<text x="20" y="198" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">One player's %macro_event, changed only by that player's own answers</text>
