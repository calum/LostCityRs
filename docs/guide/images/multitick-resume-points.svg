<text x="159.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">3</text>
<text x="159.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">NPC</text>
<text x="159.0" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">events</text>
<rect x="190" y="48" width="54" height="64" rx="6" fill="#111111" stroke="#111111" stroke-width="2.5"/>
<text x="217.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">4</text>
<text x="217.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">NPCs</text>
<rect x="248" y="48" width="54" height="64" rx="6" fill="#111111" stroke="#111111" stroke-width="2.5"/>
<text x="275.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">5</text>
<text x="275.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">players</text>
<rect x="306" y="48" width="54" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="333.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">6</text>
<text x="333.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">logouts</text>
<rect x="364" y="48" width="54" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="391.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">7</text>
<text x="391.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">logins</text>
<rect x="422" y="48" width="54" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="449.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">8</text>
<text x="449.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">zones</text>
