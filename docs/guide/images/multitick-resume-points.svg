<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 312" width="700" height="312" role="img">
<title>The eleven phases with the four resume points highlighted: world queue, packet decode, NPC turn and player turn</title>
<rect x="0" y="0" width="700" height="312" fill="#ffffff"/>
<text x="350" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">Where a waiting script comes back, within one tick</text>
<rect x="16" y="48" width="54" height="64" rx="6" fill="#111111" stroke="#111111" stroke-width="2.5"/>
<text x="43.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">1</text>
<text x="43.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">world</text>
<rect x="74" y="48" width="54" height="64" rx="6" fill="#111111" stroke="#111111" stroke-width="2.5"/>
