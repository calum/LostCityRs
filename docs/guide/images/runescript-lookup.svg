<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 426" width="600" height="426" role="img">
<title>Script lookup tries the specific key, then the category key, then the global key</title>
<rect x="0" y="0" width="600" height="426" fill="#ffffff"/>
<text x="300" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">How the engine finds the script for a click</text>
<text x="300" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666666">getByTrigger(trigger, typeId, categoryId): first hit wins</text>
<rect x="30" y="74" width="330" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="46" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">1</text>
<text x="70" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">specific</text>
<text x="70" y="126" font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">trigger | (2 &lt;&lt; 8) | (typeId &lt;&lt; 10)</text>
<line x1="360" y1="107" x2="402" y2="107" stroke="#111111" stroke-width="2.5"/>
<polygon points="400,100 400,114 410,107" fill="#111111"/>
<rect x="410" y="82" width="160" height="50" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="490" y="112" font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">[opnpc1,hans]</text>
<line x1="195" y1="140" x2="195" y2="151" stroke="#111111" stroke-width="2.5"/>
<polygon points="188,149 202,149 195,158" fill="#111111"/>
<text x="205" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#666666">miss</text>
<rect x="30" y="158" width="330" height="66" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.5"/>
<text x="46" y="186" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">2</text>
<text x="70" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">category</text>
<text x="70" y="210" font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">trigger | (1 &lt;&lt; 8) | (categoryId &lt;&lt; 10)</text>
<line x1="360" y1="191" x2="402" y2="191" stroke="#111111" stroke-width="2.5"/>
<polygon points="400,184 400,198 410,191" fill="#111111"/>
<rect x="410" y="166" width="160" height="50" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="490" y="196" font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">[opnpc1,_citizen]</text>
<line x1="195" y1="224" x2="195" y2="235" stroke="#111111" stroke-width="2.5"/>
<polygon points="188,233 202,233 195,242" fill="#111111"/>
<text x="205" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#666666">miss</text>
<rect x="30" y="242" width="330" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
<text x="46" y="270" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">3</text>
<text x="70" y="270" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#111111">global</text>
<text x="70" y="294" font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111">trigger</text>
<line x1="360" y1="275" x2="402" y2="275" stroke="#111111" stroke-width="2.5"/>
<polygon points="400,268 400,282 410,275" fill="#111111"/>
<rect x="410" y="250" width="160" height="50" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="490" y="280" font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111">[opnpc1,_]</text>
<rect x="30" y="330" width="540" height="44" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="6,4"/>
<text x="300" y="357" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111">all three miss: the interaction ends without a script (default op message)</text>
<text x="300" y="406" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#111111">A more specific script shadows the others: only one runs.</text>
</svg>
