# Builds the relic wiki (GitHub Pages root) and keeps the MkDocs site (docs/) as a workflow artifact.
# One-time repo setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site only needs docs/, so the submodules are not cloned.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r docs-site/requirements.txt
      # The MkDocs site is no longer published to Pages. It is kept as a downloadable workflow artifact
      # (mkdocs-site, 90 days) so it can be re-hosted; the source stays in docs/ and mkdocs.yml.
      - run: mkdocs build --strict --site-dir mkdocs-site
      - uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: mkdocs-site
          retention-days: 90
      # The Pages site is only the relic wiki: site/index.html is generated from docs/guide/relic-mode-player-guide.md.
      - run: python docs/tools/relic-wiki/build_relic_wiki.py site
      # Custom domain for the Pages site: the wiki is at https://wiki.rogue-relics.co.uk/.
      # A CNAME file in the artifact keeps the domain set on each deploy. Needs a DNS CNAME wiki -> calum.github.io.
      - run: echo wiki.rogue-relics.co.uk > site/CNAME
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
