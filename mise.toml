# Local setup tasks for LostCityRS. Guide: docs/setup/local-setup-with-mise.md
# `mise run up` was run end to end on Linux (mise 2026.10.6): it built the
# client, started the server and a browser logged in. On Windows the steps
# (setup, client:build, start) were run in sequence and the server came up.

[tools]
# Engine-TS/package.json:6 requires node >=24; Server/README.md:27 says Node 24+.
node = "24"
# Builds the web client: Client-TS/package.json:10 runs `bun run bundle.ts`.
# Pinned to the version that was run.
bun = "1.3.10"
# Only needed for the docs site (docs-site/requirements.txt): MkDocs is a Python tool.
python = "3.12"

[tasks.up]
description = "Set up, build the web client, then start the server (open the URL it prints)"
depends = ["setup"]
run = ["mise run client:build", "mise run start"]

[tasks.setup]
description = "Link content/ if needed and install engine and client dependencies"
depends = ["content:link", "engine:install", "client:install"]

[tasks."submodules:init"]
description = "Clone the Engine-TS, Content and Client-TS submodules (first clone only)"
# Warning: on submodules that are already checked out, this moves them to the
# commit recorded in this repo and detaches HEAD from main.
run = "git submodule update --init Engine-TS Content Client-TS"

[tasks."content:link"]
description = "Make ../content resolve to the Content submodule (needed on case-sensitive filesystems)"
run = "node scripts/link-content.mjs"

[tasks."engine:install"]
description = "Install engine npm dependencies"
dir = "{{config_root}}/Engine-TS"
run = "npm install"

[tasks."client:install"]
description = "Install client dependencies"
dir = "{{config_root}}/Client-TS"
run = "bun install"

[tasks."client:build"]
description = "Build Client-TS and copy its output over the engine's prebuilt copy"
dir = "{{config_root}}/Client-TS"
run = [
  "bun run build",
  "node ../scripts/copy-client.mjs",
]

[tasks.start]
description = "Pack the cache if needed, then start the world, game TCP server, web server and management server"
dir = "{{config_root}}/Engine-TS"
run = "npm start"

[tasks.dev]
description = "Like start, but restarts when engine .ts files change"
dir = "{{config_root}}/Engine-TS"
depends = ["engine:install"]
run = "npm run dev"

[tasks.test]
description = "Headless tests: sync mods, pack what changed, run tests/*.test.ts in-process (docs/setup/headless-test-harness.md)"
depends = ["engine:install"]
run = "node harness/run.mjs"

[tasks."test:types"]
description = "Typecheck the test harness and the tests"
dir = "{{config_root}}/Engine-TS"
run = "npx tsc -p ../harness/tsconfig.json"

[tasks."mods:sync"]
description = "Copy mods/ (your scripts) into Content/scripts/_mods/ once"
run = "node scripts/sync-mods.mjs"

[tasks."mods:watch"]
description = "Copy mods/ into Content/scripts/_mods/ now and on every change (the running server then reloads)"
run = "node scripts/sync-mods.mjs --watch"

[tasks.live]
description = "Script dev loop: start the server and keep mods/ synced; edits in mods/ reload in game"
depends = ["mods:watch", "start"]

[tasks.configure]
description = "Open the engine's setup page (http://localhost:8898/setup) to edit data/config/world.json"
dir = "{{config_root}}/Engine-TS"
run = "npm run setup"

[tasks."engine:clean-build"]
description = "Delete packed data and repack the cache from Content"
dir = "{{config_root}}/Engine-TS"
depends = ["engine:install"]
run = ["npm run clean", "npm run build"]

[tasks."docs:install"]
description = "Install MkDocs and the Material theme for the docs site"
run = "python -m pip install -r docs-site/requirements.txt"

[tasks."docs:serve"]
description = "Preview the docs site with live reload at http://127.0.0.1:8000"
depends = ["docs:install"]
run = "python -m mkdocs serve"

[tasks."docs:build"]
description = "Build the docs site into site/ (the same build GitHub Pages runs)"
depends = ["docs:install"]
run = "python -m mkdocs build --strict"

[tasks."relics:hooks"]
description = "List every relic hook in the forks (must match docs/local-changes.md)"
run = [
  "git -C Content grep -n '~relic_' -- scripts ':!scripts/_mods' || true",
  "git -C Engine-TS grep -n -i relic || true",
]

[tasks."relics:config"]
description = "Copy config/world.json (xpRate 8, BUILD_VERIFY off) to Engine-TS/data/config/ (restart the server after)"
run = "node -e \"require('fs').mkdirSync('Engine-TS/data/config',{recursive:true});require('fs').copyFileSync('config/world.json','Engine-TS/data/config/world.json')\""
